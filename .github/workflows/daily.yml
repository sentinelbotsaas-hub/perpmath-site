# Daily release of perpmath.com.
#
#   1. try to fetch yesterday's market data from Bybit's public API (no key;
#      blocked from GitHub-hosted runners, see the step)
#   2. build for today's UTC date: articles dated today appear, links to later
#      ones stay plain text (scripts/unreleased-links.mjs), then test and check
#   3. commit the day's market data to main
#   4. deploy to production with the Vercel CLI
#   5. check the live site, then tell IndexNow
#
# Nothing is deployed unless the build, the tests and the dist check pass.
#
# Secrets it needs (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN        a Vercel access token for the team that owns the project
#   VERCEL_ORG_ID       "orgId" from .vercel/project.json
#   VERCEL_PROJECT_ID   "projectId" from .vercel/project.json
# Without VERCEL_TOKEN the deploy step fails with a message that says so.
#
# It runs on three occasions:
#   - when market data is pushed to main. The site owner's computer does that
#     once a day (it can reach Bybit), and this run starts within seconds.
#   - every day on a schedule, so the day's articles are released even when
#     that computer was off. GitHub starts scheduled runs late, sometimes by
#     hours. The build day is the UTC date at the moment the build runs, so a
#     late run still releases the right articles.
#   - by hand, from the Actions tab.
name: Daily release

on:
  push:
    branches: [main]
    paths: ['src/data/market/**']
  schedule:
    - cron: '20 0 * * *' # 00:20 UTC, twenty minutes after Bybit closes the daily candle
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production (untick to only fetch, build and check)
        type: boolean
        default: true

permissions:
  contents: write # step 3 pushes the market data commit

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # scripts/fetch-market.mjs imports the TypeScript in src/lib/market/
      # directly, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Not `npm ci`: the lock file is written on Windows and npm leaves the
      # dependencies of other platforms' optional packages out of it, which
      # `npm ci` on Linux refuses. `npm install` keeps every locked version and
      # adds the missing entries to the lock file; that edit is dropped again.
      - run: |
          npm install --no-audit --no-fund
          git checkout -- package-lock.json

      # Bybit's public API refuses United States addresses (HTTP 403 from every
      # Bybit host, measured from a GitHub-hosted runner on 22 November 2026),
      # and GitHub-hosted runners are in the United States. So this step fails
      # here today and the daily reports are only as fresh as the last market
      # data commit pushed from a machine Bybit accepts. The step stays so that
      # the workflow fetches by itself on a runner that can reach Bybit.
      # It writes nothing unless every symbol came back complete, and a failure
      # must not hold back the day's articles: the job goes on and says so.
      - name: Fetch market data
        id: market
        continue-on-error: true
        run: node scripts/fetch-market.mjs

      - name: Note that the market data is a day old
        if: steps.market.outcome == 'failure'
        run: |
          git checkout -- src/data/market
          echo "::warning::Market data could not be fetched. The daily reports keep yesterday's numbers."

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the built site
        run: npm run check:dist

      - name: Commit the day's data
        run: |
          git config user.name "sentinelbotsaas-hub"
          git config user.email "321465813+sentinelbotsaas-hub@users.noreply.github.com"
          git add src/data/market
          if git diff --cached --quiet; then
            echo "no new market data"
          else
            git commit -m "Market data for the $(date -u +%F) build"
            git push
          fi
          test -z "$(git status --porcelain)" || { echo "the build left other changes behind"; git status --short; exit 1; }

      - name: Deploy to production
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set in the repository secrets. Nothing was deployed."
            exit 1
          fi
          npx --yes vercel@54 deploy --prod --yes --token "$VERCEL_TOKEN"

      # The live site must serve the home page and every article built today.
      - name: Check the live site
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        run: |
          fail=0
          for path in / /learn/ /sitemap-index.xml $(cd dist && ls -d learn/*/ zh-hant/learn/*/ 2>/dev/null | sed 's|^|/|'); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://perpmath.com$path")"
            [ "$code" = 200 ] || { echo "::error::live check failed: HTTP $code $path"; fail=1; }
          done
          exit $fail

      - name: Tell IndexNow
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        run: node scripts/indexnow.mjs
